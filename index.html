<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>군밤 타이쿤</title>
<style>
:root{--bg:#0d0a08;--metal1:#5e5955;--metal2:#2a2623;--metal3:#120f0d;--text:#fff;--panel:#171310;--panel2:#241c18;--accent:#6f9c31;--warn:#a85b24}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
body{display:flex;justify-content:center;align-items:center}
button{cursor:pointer;border:none;background:none}
img{-webkit-user-drag:none;pointer-events:none}

/* ── 핵심: 모든 기기 비율 최적화 ── */
.app{
  /* 9:16 세로형. 화면 가득 채우되 비율 유지 */
  width:min(100dvw, calc(100dvh * 9 / 16));
  height:min(100dvh, calc(100dvw * 16 / 9));
  /* 폰트 크기를 앱 높이에 비례 */
  font-size:clamp(10px, 1.7dvh, 16px);
  aspect-ratio:9/16;
  overflow:hidden;
  background:#111;
  position:relative;
  color:#fff;
}

/* 상단바 */
.topbar{
  height:6%;
  display:grid;
  grid-template-columns:1fr 1fr .8fr .8fr 1fr .9fr;
  gap:clamp(2px,0.5vw,6px);
  padding:clamp(2px,0.5vh,5px) clamp(4px,1vw,10px) clamp(3px,0.6vh,7px);
  background:linear-gradient(to bottom,#2a211c,#14110f);
}
.topitem,.status{
  border-radius:clamp(6px,1.5vw,12px);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:clamp(8px,1.4dvh,13px);
  font-weight:900;
  background:#1b1715;
  border:1px solid rgba(255,255,255,.08);
  overflow:hidden;
}
.status.on{background:#45621e}
.status.off{background:#742d25}

/* 메인 레이아웃 */
.main{
  height:94%;
  padding:0 clamp(4px,1vw,10px) clamp(4px,1vw,10px);
  display:grid;
  grid-template-rows:25% 36% 39%;
  gap:clamp(4px,1vw,10px);
}

/* 창문(손님) 영역 */
.window{position:relative;overflow:hidden;border-radius:clamp(12px,2.5vw,22px);border:2px solid #674b39;background:#000}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.orders{position:absolute;top:clamp(4px,1vw,10px);left:clamp(4px,1vw,10px);right:clamp(4px,1vw,10px);display:grid;grid-template-columns:1fr 1fr 1fr;gap:clamp(3px,0.8vw,8px);z-index:5}
.order{opacity:0;transition:.35s}.order.show{opacity:1}
.bubble{background:#f3eadb;color:#1b1510;border-radius:clamp(8px,2vw,16px);padding:clamp(3px,0.8vw,8px);min-height:clamp(30px,5vh,50px);display:flex;justify-content:center;align-items:center;text-align:center;font-size:clamp(7px,1.2dvh,11px);line-height:1.2;font-weight:900}
.badge{margin-top:clamp(2px,0.4vh,4px);border-radius:999px;padding:clamp(2px,0.4vh,4px);text-align:center;font-size:clamp(6px,1dvh,9px);font-weight:900;color:#fff}
.wait{background:#9b692d}.done{background:#4d9031}.normal{background:#4d9031}.special{background:#7d60a3}.slush{background:#406f98}.combo{background:#8b4513}

/* 손님 */
.guests{position:absolute;inset:0}
.guest{position:absolute;bottom:-28%;width:31%;opacity:0;transform:translateY(10px);transition:opacity .35s,transform .35s;touch-action:none}
.guest.show{opacity:1;transform:translateY(0)}
.guest img{width:100%;display:block;pointer-events:none}
.g1{left:0}.g2{left:34%;width:33%}.g3{right:0}
.guest-dismiss-hint{position:absolute;top:-18px;left:50%;transform:translateX(-50%);background:rgba(180,50,50,.92);color:#fff;font-size:clamp(6px,1dvh,9px);font-weight:900;border-radius:999px;padding:2px 8px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.guest.holding .guest-dismiss-hint{opacity:1}

/* 기계 영역 */
.machine{display:grid;grid-template-columns:1fr 1fr;gap:clamp(4px,1vw,10px)}
.panel{background:linear-gradient(to bottom,var(--metal1),var(--metal2) 40%,var(--metal3));border:1px solid rgba(255,255,255,.08);overflow:hidden;border-radius:clamp(12px,2.5vw,22px)}
.chestnut-panel{padding:clamp(4px,1vw,10px);display:grid;grid-template-rows:1fr auto;gap:clamp(4px,1vw,10px)}
.grill-zone{border-radius:clamp(10px,2vw,20px);background:#0a0908;position:relative;overflow:hidden;display:flex;justify-content:center;align-items:center;touch-action:none;min-height:0}
.grill{width:92%;object-fit:contain;pointer-events:none}
.tray{position:absolute;inset:clamp(6px,1.5vw,14px);display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:clamp(2px,0.5vw,5px);justify-items:center;align-content:center;padding:clamp(3px,0.7vw,7px);border-radius:clamp(8px,2vw,18px);background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);touch-action:none}
.tray.empty{background:transparent;border-color:transparent}
.tray img{width:clamp(8px,1.8vw,16px);height:clamp(8px,1.8vw,16px);object-fit:contain}
.heat-control{padding:clamp(4px,0.8vw,8px);border-radius:clamp(8px,1.8vw,16px);background:#0d0b09;border:1px solid rgba(255,255,255,.08);touch-action:none}
.timer-box{background:#0f0c0a;border-radius:clamp(6px,1.2vw,12px);padding:clamp(3px,0.6vw,6px) clamp(5px,1vw,10px);display:flex;justify-content:center;gap:4px;font-size:clamp(8px,1.4dvh,13px);font-weight:900;border:1px solid rgba(255,255,255,.08);margin-bottom:clamp(3px,0.7vw,7px)}
.timer-target{color:#ffd768}
.heatbar{height:clamp(10px,2dvh,18px);border-radius:999px;overflow:hidden;position:relative;background:#241b17;display:flex}
.gauge-zones{position:absolute;inset:0;display:flex;overflow:hidden;border-radius:999px}
.gauge-zone{height:100%;flex:0 0 auto}.gauge-under{background:#c53a22}.gauge-perfect{background:#5fa642}.gauge-over{background:#c53a22}
.fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:rgba(255,255,255,.16);z-index:2;pointer-events:none}
.cursor{position:absolute;top:-4px;width:4px;height:clamp(16px,3dvh,26px);background:#000;border-radius:999px;transform:translateX(-50%)}
.labels{margin-top:clamp(2px,0.4vh,5px);position:relative;height:clamp(10px,1.4dvh,14px);font-size:clamp(6px,1dvh,9px);font-weight:900}.labels span{position:absolute;white-space:nowrap}.label-under{left:0}.label-perfect{left:50%;transform:translateX(-50%)}.label-over{right:0}

/* 슬러시 패널 */
.slush-panel-wrap{width:100%;padding:clamp(4px,1vw,10px);display:grid;grid-template-columns:1fr 1fr 1fr;gap:clamp(4px,1vw,8px);align-items:end;background:linear-gradient(to bottom,#5e5955,#2a2623 40%,#120f0d);border-radius:clamp(12px,2.5vw,22px);height:100%;box-sizing:border-box}
.slush-machine-new{border-radius:clamp(10px,2vw,20px);background:linear-gradient(to bottom,#6d6d6d,#343434 40%,#121212);border:1px solid rgba(255,255,255,.08);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:clamp(4px,1vw,10px) clamp(2px,0.5vw,6px) clamp(3px,0.8vw,8px);min-height:0;flex:1;cursor:pointer;transition:border-color .2s}
.slush-liquid-new{position:absolute;left:18%;right:18%;bottom:34%;border-radius:12px 12px 8px 8px;opacity:.75;transition:.2s;z-index:1}
.slush-img-new{width:88%;object-fit:contain;margin-top:8px;position:relative;z-index:2;pointer-events:none}
.slush-base-new{width:100%;height:clamp(8px,1.5vw,16px);border-radius:10px;background:#1b1b1b;margin-top:4px;position:relative;z-index:2}
.slush-text-new{margin-top:3px;font-size:clamp(6px,1dvh,10px);font-weight:900;text-align:center;line-height:1.2;color:#fff;position:relative;z-index:2}

/* 하단 */
.bottom{overflow:hidden;display:grid;grid-template-columns:1.45fr .95fr;gap:clamp(4px,1vw,10px)}
.stock,.menu{overflow:hidden;border-radius:clamp(12px,2.5vw,22px);border:1px solid rgba(255,255,255,.08);background:linear-gradient(to bottom,#2d231e,#14110f);display:flex;flex-direction:column}
.title{padding:clamp(4px,0.8vw,8px) clamp(8px,1.5vw,14px) clamp(3px,0.6vw,7px);font-size:clamp(10px,1.8dvh,15px);font-weight:900;flex-shrink:0}
.stock-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 clamp(4px,0.8vw,10px) clamp(4px,0.8vw,10px);-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}
.stock-scroll::-webkit-scrollbar{width:3px}
.stock-scroll::-webkit-scrollbar-track{background:transparent}
.stock-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:999px}
.stock-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:clamp(4px,1vw,10px)}
.card{min-height:clamp(70px,12dvh,100px);border-radius:clamp(10px,2vw,16px);border:2px solid rgba(255,255,255,.06);background:#1a1512;display:flex;flex-direction:column;align-items:center;padding:clamp(4px,0.8vw,8px);position:relative;color:#fff;touch-action:pan-y}
.card.selected{border-color:#4df34b;box-shadow:0 0 14px rgba(77,243,75,.24)}
.card img{width:100%;height:clamp(30px,5.5dvh,48px);object-fit:contain}
.name{margin-top:clamp(2px,0.3vh,4px);font-size:clamp(6px,1dvh,9px);line-height:1.15;text-align:center;font-weight:900;color:#fff}
.qty{margin-top:auto;font-size:clamp(9px,1.6dvh,13px);font-weight:900;color:#fff}
.under{filter:brightness(1.5) saturate(.6)}.good{filter:brightness(1.42)}.dark{filter:brightness(.4) contrast(1.4)}.soft{filter:brightness(.93)}.syrup{filter:brightness(.96) saturate(1.15)}.slushitem{filter:brightness(1.1) saturate(1.15)}.bagcard{filter:brightness(1.05)}

/* 메뉴 버튼 */
.menu-grid{flex:1;padding:0 clamp(4px,0.8vw,10px) clamp(4px,0.8vw,10px);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:clamp(4px,0.8vw,10px)}
.mbtn{border:none;border-radius:clamp(10px,2vw,18px);color:#fff;font-size:clamp(8px,1.4dvh,12px);line-height:1.2;font-weight:900;touch-action:none;transition:transform .1s,box-shadow .1s}
.mbtn:active{transform:scale(.97)}
.m1{background:#668c2f}.m2{background:#406f98}.m3{background:#87532c}.m4{background:#7d60a3}.m5{background:#7b2d24}.m6{background:#555}

/* 오버레이/모달 */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.82);display:none;justify-content:center;align-items:center;z-index:300}
.overlay.show{display:flex}
.modal{width:88%;max-height:86%;overflow-y:auto;border-radius:clamp(14px,3vw,24px);background:#171310;border:1px solid rgba(255,255,255,.08);padding:clamp(10px,2vw,16px);position:relative}
.modal::-webkit-scrollbar{width:3px}.modal::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:999px}
.modal-title{font-size:clamp(14px,2.5dvh,20px);font-weight:900;margin-bottom:clamp(6px,1.2vw,12px);text-align:center}
.modal-close-btn{position:absolute;top:clamp(6px,1.2vw,12px);right:clamp(8px,1.5vw,14px);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:clamp(9px,1.4dvh,13px);font-weight:900;border-radius:999px;padding:clamp(3px,0.5vw,5px) clamp(8px,1.5vw,12px);cursor:pointer;z-index:1}

/* 칼질 카드 */
.peel-card{width:min(72vw,260px);border-radius:22px;background:#15110f;border:1px solid rgba(255,255,255,.08);padding:14px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:8px;touch-action:none;-webkit-user-select:none;user-select:none}
.peel-card-imgs{position:relative;width:100%;height:clamp(100px,18dvh,170px)}
.peel-card.knife-slice-flash{animation:knifeSliceFlash .22s ease-out}
@keyframes knifeSliceFlash{0%{filter:brightness(1);transform:translateX(0)}25%{filter:brightness(1.9);transform:translateX(-2px) rotate(-1deg)}55%{filter:brightness(1.25);transform:translateX(2px) rotate(1deg)}100%{filter:brightness(1);transform:translateX(0) rotate(0)}}
.peel-card.knife-slice-flash::after{content:'✦';position:absolute;left:50%;top:38%;z-index:20;color:#fff;font-size:clamp(22px,7dvh,48px);text-shadow:0 0 8px #ffd768,0 0 18px #fff;pointer-events:none;animation:knifeSpark .22s ease-out forwards}
@keyframes knifeSpark{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-30deg)}35%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(10deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5) rotate(35deg)}}
.peel-img-base{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1}
.peel-img-reveal{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:2;clip-path:inset(100% 0 0 0);transition:clip-path .15s ease-out}
.peel-name,.peel-count,.peel-hint{z-index:1}
.peel-name{font-size:clamp(11px,2dvh,15px);font-weight:900}
.peel-count{font-size:clamp(10px,1.8dvh,13px);font-weight:900;color:#7ef47b}
.peel-hint{font-size:clamp(10px,1.8dvh,13px);font-weight:900;color:#d9c8a7}
.peel-canvas{position:absolute;inset:0;z-index:10;pointer-events:none;border-radius:22px}

/* 상점 */
.shop-cart{background:#231b16;border:1px solid rgba(255,255,255,.08);border-radius:clamp(12px,2.5vw,20px);padding:clamp(8px,1.5vw,14px);margin-bottom:clamp(8px,1.5vw,16px)}
.cart-head{font-size:clamp(11px,2dvh,16px);font-weight:900;margin-bottom:clamp(5px,1vw,10px)}.cart-note{font-size:clamp(8px,1.3dvh,11px);font-weight:900;color:#d6c9b6;margin-top:4px}
.cart-list{display:flex;flex-direction:column;gap:clamp(5px,1vw,10px);margin-bottom:clamp(7px,1.3vw,12px)}
.cart-item{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;background:#1a1512;border-radius:clamp(10px,2vw,16px);padding:clamp(6px,1.2vw,10px);border:1px solid rgba(255,255,255,.06)}
.cart-item.noimg{grid-template-columns:1fr auto}
.cart-empty-text{font-size:clamp(9px,1.5dvh,12px);font-weight:900;color:#fff;line-height:1.3}
.cart-item img{width:34px;height:34px;object-fit:contain}
.cart-item-title{font-size:clamp(9px,1.6dvh,12px);font-weight:900;line-height:1.15}.cart-item-sub{font-size:clamp(8px,1.3dvh,10px);color:#c9b7a0;font-weight:900;margin-top:2px}
.cart-step{display:flex;align-items:center;gap:5px}.cart-step button{width:clamp(20px,3.5vw,26px);height:clamp(20px,3.5vw,26px);border:none;border-radius:8px;background:#3b2d24;color:#fff;font-weight:900}.cart-step span{width:20px;text-align:center;font-size:clamp(9px,1.6dvh,13px);font-weight:900}
.cart-sum{display:flex;flex-direction:column;gap:4px;padding-top:8px;border-top:1px solid rgba(255,255,255,.08);font-size:clamp(9px,1.5dvh,12px);font-weight:900}
.cart-sum .total{font-size:clamp(10px,1.8dvh,15px);color:#7ef47b}
.checkout-btn{width:100%;border:none;border-radius:clamp(10px,2vw,18px);background:#688d31;color:#fff;font-weight:900;padding:clamp(9px,1.8vw,14px);margin-top:clamp(7px,1.3vw,12px);font-size:clamp(10px,1.8dvh,15px)}
.shop-section{margin-bottom:clamp(8px,1.5vw,16px)}.shop-section-title{font-size:clamp(11px,2dvh,16px);font-weight:900;margin-bottom:clamp(5px,1vw,10px)}
.shop-item{border-radius:clamp(12px,2.5vw,20px);background:#241c18;padding:clamp(8px,1.5vw,14px);display:flex;flex-direction:column;gap:clamp(7px,1.3vw,12px);margin-bottom:clamp(7px,1.3vw,12px)}
.shop-top{display:flex;align-items:center;gap:clamp(6px,1.2vw,12px)}.shop-item img{width:clamp(38px,7vw,56px);height:clamp(38px,7vw,56px);object-fit:contain}
.shop-text{font-size:clamp(9px,1.6dvh,13px);line-height:1.35;font-weight:900}
.shop-add{border:none;border-radius:clamp(10px,2vw,16px);background:#4f7f2a;color:#fff;font-weight:900;padding:clamp(8px,1.5vw,12px);width:100%}.shop-add:active{transform:scale(.99)}
.shop-up{display:grid;grid-template-columns:1fr 1fr;gap:clamp(5px,1vw,10px)}
.shop-up button{border:none;border-radius:clamp(12px,2.5vw,20px);padding:clamp(9px,1.8vw,14px) clamp(5px,1vw,10px);color:#fff;font-weight:900;font-size:clamp(9px,1.5dvh,13px)}
.up1{background:#668c2f}.up2{background:#406f98}.up3{background:#87532c}

/* 봉지 */
.bag-list{display:flex;flex-direction:column;gap:clamp(7px,1.3vw,12px)}
.bag-card{background:#231b16;border:1px solid rgba(255,255,255,.08);border-radius:clamp(12px,2.5vw,20px);padding:clamp(8px,1.5vw,12px)}
.bag-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:clamp(10px,1.8dvh,14px);font-weight:900;margin-bottom:clamp(5px,1vw,10px)}
.bag-sub{color:#fff;font-size:clamp(8px,1.4dvh,11px);font-weight:900;margin-top:2px}
.bag-items{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(5px,1vw,10px)}
.bag-item{background:#1a1512;border:1px solid rgba(255,255,255,.06);border-radius:clamp(8px,1.8vw,14px);padding:clamp(4px,0.8vw,8px) clamp(3px,0.6vw,6px);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:clamp(60px,10dvh,78px);touch-action:none}
.bag-item img{width:clamp(22px,4vw,32px);height:clamp(22px,4vw,32px);object-fit:contain}.bag-item span{font-size:clamp(7px,1.2dvh,10px);line-height:1.1;text-align:center;font-weight:900;color:#fff}
.bag-actions{margin-top:clamp(7px,1.3vw,12px);display:flex;gap:clamp(5px,1vw,10px)}.bag-actions button{flex:1;border:none;border-radius:clamp(10px,2vw,16px);padding:clamp(9px,1.8vw,14px) clamp(5px,1vw,10px);font-weight:900;color:#fff;font-size:clamp(10px,1.8dvh,14px)}
.bag-close{background:#555}.bag-remove{background:#7b2d24}

/* 정보 */
.info-text{display:flex;flex-direction:column;gap:clamp(7px,1.3vw,12px);font-size:clamp(10px,1.8dvh,14px);line-height:1.45;font-weight:900}
.info-box{background:#1f1814;border:1px solid rgba(255,255,255,.08);border-radius:clamp(12px,2.5vw,20px);padding:clamp(8px,1.5vw,14px)}.info-box h3{font-size:clamp(11px,2dvh,15px);margin-bottom:6px}.info-box p{color:#e8dccb;font-size:clamp(9px,1.5dvh,12px);line-height:1.45}

/* 슬러시 판매 모달 */
.slush-sell-modal{background:#171310;border:1px solid rgba(255,255,255,.08);border-radius:clamp(14px,3vw,24px);padding:clamp(12px,2.5vw,18px);width:80%;max-width:300px}
.slush-sell-title{font-size:clamp(12px,2.2dvh,17px);font-weight:900;text-align:center;margin-bottom:clamp(8px,1.5vw,14px)}
.slush-sell-info{font-size:clamp(9px,1.6dvh,13px);color:#c9b7a0;font-weight:900;text-align:center;margin-bottom:clamp(10px,2vw,16px);line-height:1.5;white-space:pre-line}
.slush-sell-btns{display:flex;flex-direction:column;gap:clamp(5px,1vw,10px)}
.slush-sell-btns button{border:none;border-radius:clamp(10px,2vw,16px);padding:clamp(9px,1.8vw,13px);font-weight:900;color:#fff;font-size:clamp(10px,1.8dvh,14px)}
.sell-cup-btn{background:#406f98}.sell-cancel-btn{background:#555}

/* 손님 쫓아내기 토스트 */

<body>

</div>

<script>
/* ─── 유틸 ─── */
const $=id=>document.getElementById(id);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

/* ─── 상수 ─── */
const FRUITS={
  papaya:{kr:'파파야',img:'Papaya.png',cup:'PapayaCup.png',color:'#46b7ff'},
  cola:{kr:'콜라',img:'Cola.png',cup:'ColaCup.png',color:'#3f2418'},
  grape:{kr:'포도',img:'Grape.png',cup:'GrapeCup.png',color:'#7c44ff'},
  orange:{kr:'오렌지',img:'Orange.png',cup:'OrangeCup.png',color:'#ff972e'},
  peach:{kr:'복숭아',img:'Peach.png',cup:'PeachCup.png',color:'#ffb381'}
};
const FRUIT_KEYS=Object.keys(FRUITS);
const CHN_KEYS=['raw_shell','raw_inner','cut_raw','under_inner','under','perfect_inner','perfect','burnt_inner','burnt'];
const BAG_PRICE=7000, SLUSH_PRICE=3000;
const PERFECT_ROAST_MIN=6, PERFECT_ROAST_MAX=8, MAX_ROAST_TIME=12;

const STAGES={
  raw_shell:{name:'생 밤 (겉껍질)',img:'1.png',next:'raw_inner'},
  raw_inner:{name:'생 밤 (속껍질)',img:'2.png',next:'cut_raw'},
  cut_raw:{name:'칼집을 낸 생 밤 (속껍질)',img:'3.png',next:null},
  under_inner:{name:'덜 익은 군밤 (속껍질)',img:'3.png',next:'under'},
  under:{name:'덜 익은 군밤',img:'6.png',cls:'under',next:null},
  perfect_inner:{name:'잘 익은 군밤 (속껍질)',img:'4.png',revealImg:'6.png',next:'perfect'},
  perfect:{name:'잘 익은 군밤',img:'6.png',cls:'good',next:null},
  burnt_inner:{name:'탄 군밤 (속껍질)',img:'5.png',cls:'dark',next:'burnt'},
  burnt:{name:'탄 군밤',img:'6.png',cls:'dark',next:null},
  cup:{name:'컵',img:'Cup.png',cls:'soft'},
  bag:{name:'종이봉지',img:'Paperbag.png',cls:'bagcard'}
};
const INVENTORY_META=Object.fromEntries(
  FRUIT_KEYS.flatMap(k=>[
    [`syrup_${k}`,{name:`${FRUITS[k].kr} 시럽 (1병)`,img:FRUITS[k].img,cls:'syrup'}],
    [`slush_${k}`,{name:`${FRUITS[k].kr} 슬러시`,img:FRUITS[k].cup,cls:'slushitem'}]
  ])
);
const metaOf=key=>STAGES[key]||INVENTORY_META[key]||{name:key,img:'Cup.png',cls:''};

/* ─── 시그니처 ─── */
let _topSig='',_gaugeSig='',_traySig='',_slushSig='',_invSig='',_bagViewSig='';
const sigTop=()=>`${money}|${guests.reduce((n,g)=>n+(g.active?1:0),0)}|${inventory.bag+bagStacks.length}|${gameMinutes}|${satisfaction.toFixed(1)}`;
const sigGauge=()=>`${current}|${target}|${timingRange}`;
const sigTray=()=>`${cooking?1:0}|${current}|${target}|${grill.map(v=>getGrillDisplayKey(v)).join(',')}`;
const sigSlush=()=>slushMachines.map(m=>`${m.flavor||'-'}:${m.serves}`).join('|');
const sigInv=()=>[...CHN_KEYS.map(k=>inventory[k]||0),inventory.cup||0,inventory.bag||0,...FRUIT_KEYS.flatMap(k=>[inventory[`syrup_${k}`]||0,inventory[`slush_${k}`]||0]),selectedType||'',selectedBagIndex,...bagStacks.map(b=>b.items.join('.'))].join('|');
const sigBag=i=>{const b=bagStacks[i];return b?`${i}|${b.items.join('.')}`:'';};

/* ─── 인벤토리 & 상태 ─── */
const inventory={raw_shell:0,raw_inner:0,cut_raw:0,under_inner:0,under:0,perfect_inner:0,perfect:0,burnt_inner:0,burnt:0,cup:0,bag:0};
FRUIT_KEYS.forEach(k=>{inventory[`syrup_${k}`]=0;inventory[`slush_${k}`]=0;});

/* "용기" 그룹으로 변경 */
const SHOP_ITEMS=[
  {id:'bagPack',group:'용기',name:'종이봉지',desc:'50개',price:2000,img:'Paperbag.png',onBuy:q=>inventory.bag+=50*q},
  {id:'chestnutPack',group:'재료',name:'생 밤 (속껍질)',desc:'80개',price:14000,img:'2.png',onBuy:q=>inventory.raw_inner+=80*q},
  {id:'cupPack',group:'용기',name:'컵',desc:'100개',price:3000,img:'Cup.png',onBuy:q=>inventory.cup+=100*q}
];
FRUIT_KEYS.forEach(k=>SHOP_ITEMS.push({id:`syrup_${k}`,group:'슬러시',name:`${FRUITS[k].kr} 시럽`,desc:'1병',price:3500,img:FRUITS[k].img,onBuy:q=>inventory[`syrup_${k}`]+=q}));

const el={
  money:$('money'),guestCount:$('guestCount'),servedCount:$('servedCount'),shopStatus:$('shopStatus'),clockText:$('clockText'),satisfactionText:$('satisfactionText'),
  tray:$('tray'),heatControl:$('heatControl'),slushPanel:$('slushPanel'),stockGrid:$('stockGrid'),stockScroll:$('stockGrid').parentElement,
  timerNow:$('timerNow'),timerTarget:$('timerTarget'),gaugeZones:$('gaugeZones'),fill:$('fill'),cursor:$('cursor'),labelPerfect:$('labelPerfect'),
  peelOverlay:$('peelOverlay'),peelCard:$('peelCard'),peelCanvas:$('peelCanvas'),
  peelImgBase:$('peelImgBase'),peelImgReveal:$('peelImgReveal'),peelName:$('peelName'),peelCount:$('peelCount'),
  shopOverlay:$('shopOverlay'),shopMaterials:$('shopMaterials'),shopSyrups:$('shopSyrups'),
  shopSupplies:$('shopSupplies'),cartList:$('cartList'),cartSub:$('cartSub'),cartShip:$('cartShip'),
  cartTotal:$('cartTotal'),checkoutBtn:$('checkoutBtn'),
  bagOverlay:$('bagOverlay'),bagTitle:$('bagTitle'),bagList:$('bagList'),
  bagCloseBtn:$('bagCloseBtn'),bagEmptyBtn:$('bagEmptyBtn'),upgradeSliceBtn:$('upgradeSliceBtn'),
  infoOverlay:$('infoOverlay'),infoText:$('infoText'),infoCloseBtn:$('infoCloseBtn'),
  slushSellOverlay:$('slushSellOverlay'),slushSellTitle:$('slushSellTitle'),
  slushSellInfo:$('slushSellInfo'),slushToCupBtn:$('slushToCupBtn'),slushSellCancelBtn:$('slushSellCancelBtn')
};

const guests=[{slot:0,active:false,order:null},{slot:1,active:false,order:null},{slot:2,active:false,order:null}];
const slushMachines=[{flavor:null,serves:0},{flavor:null,serves:0},{flavor:null,serves:0}];
const cart={};
const stats={ordersCreated:0,normalOrders:0,specialOrders:0,slushOrders:0,comboOrders:0,served:0,failed:0,revenue:0,chestnutsSold:0,slushSold:0};

let money=60000,selectedType=null,selectedBagIndex=-1,bagStacks=[],grill=[],current=0,target=0,cooking=false,timer=null,exploded=false,maxMachine=30,timingRange=1.2,shopOpen=false,guestLoop=null;
let pendingSlushMachineIndex=-1;
let gameMinutes=8*60;
let satisfaction=3.0;
let clockTimer=null;
let sliceLevel=0,slicePerSwipe=1;
let chestnutServeStage=0;
let tutorialPurchased={bagPack:0,chestnutPack:0};
let roastTimeUpgrades=0;

/* ─── 시간 함수 ─── */
function formatClock(totalMinutes){
  const mins=((totalMinutes%1440)+1440)%1440;
  const hh=Math.floor(mins/60);
  const mm=mins%60;
  const ampm=hh<12?'오전':'오후';
  const h12=hh%12||12;
  return `${ampm} ${h12}:${String(mm).padStart(2,'0')}`;
}
function getTimePhase(totalMinutes){
  const m=((totalMinutes%1440)+1440)%1440;
  if(m<360)return '새벽';if(m<600)return '아침';if(m<840)return '점심';if(m<1080)return '오후';if(m<1320)return '저녁';return '밤';
}

/* ─── 굽기 시간 계산 ─── */
function getRoastTarget(){
  const base=PERFECT_ROAST_MIN+Math.random()*(PERFECT_ROAST_MAX-PERFECT_ROAST_MIN);
  return Math.max(1.5,base-roastTimeUpgrades*0.2);
}

/* ─── 기본 함수 ─── */
function syncTop(){const s=sigTop();if(s===_topSig)return;_topSig=s;el.money.textContent=money.toLocaleString();el.guestCount.textContent=guests.reduce((n,g)=>n+(g.active?1:0),0);if(el.servedCount)el.servedCount.textContent=stats.served;el.clockText.textContent=formatClock(gameMinutes);el.satisfactionText.textContent=satisfaction.toFixed(1);}
function updateGauge(){
  const s=sigGauge();if(s===_gaugeSig)return;_gaugeSig=s;
  el.timerNow.textContent=current.toFixed(2);el.timerTarget.textContent=target.toFixed(2);
  const max=MAX_ROAST_TIME, w=clamp(timingRange/8,0.12,0.28);
  const under=clamp(target-w,0,max), perfect=clamp(target+w,0,max), pct=v=>max?v/max*100:0;
  if(el.gaugeZones){el.gaugeZones.innerHTML='';if(target<=0){const z=document.createElement('div');z.className='gauge-zone gauge-under';z.style.width='100%';el.gaugeZones.appendChild(z);}else{[['gauge-under',pct(under)],['gauge-perfect',Math.max(0,pct(perfect)-pct(under))],['gauge-over',Math.max(0,100-pct(perfect))]].forEach(([c,x])=>{const z=document.createElement('div');z.className='gauge-zone '+c;z.style.width=x+'%';el.gaugeZones.appendChild(z);});}}
  const now=clamp(pct(current),0,100);el.fill.style.width=now+'%';el.cursor.style.left=now+'%';
  if(el.labelPerfect)el.labelPerfect.style.left=(target>0?clamp(pct(target),0,100):50)+'%';
}
function resultType(type){
  const inner=type.includes('inner')||type==='raw_inner'||type==='cut_raw';
  const perfectWindow=clamp(timingRange/8,0.12,0.28);
  if(current<target-perfectWindow)return inner?'under_inner':'under';
  if(current<=target+perfectWindow)return inner?'perfect_inner':'perfect';
  return inner?'burnt_inner':'burnt';
}
const openOverlay=node=>node.classList.add('show');
const closeOverlay=node=>node.classList.remove('show');
function showToast(message){const t=document.createElement('div');t.className='dismiss-toast';t.textContent=message;$('appRoot').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);},1200);}
const countMap=items=>{const m={};items.forEach(k=>m[k]=(m[k]||0)+1);return m;};

function createChestnutOrder(special){
  let counts;
  if(!special){counts={perfect:15,under:0,burnt:0};}
  else{const imp=1+Math.floor(Math.random()*15);const u=Math.floor(Math.random()*(imp+1));counts={perfect:15-imp,under:u,burnt:imp-u};}
  return{kind:'chestnut',mode:special?'special':'normal',counts,total:15,text:summarizeChestnutCounts(counts)+' 주세요',payout:special?8000:7000};
}
function createOrder(){
  stats.ordersCreated++;

  if(r<0.10){stats.slushOrders++;const flavor=FRUIT_KEYS[Math.floor(Math.random()*FRUIT_KEYS.length)];return{kind:'slush',flavor,total:1,text:`${FRUITS[flavor].kr} 슬러시 1개 주세요`,payout:SLUSH_PRICE};}
  if(r<0.50){stats.comboOrders++;const special=Math.random()<0.08;special?stats.specialOrders++:stats.normalOrders++;const cOrder=createChestnutOrder(special);const flavor=FRUIT_KEYS[Math.floor(Math.random()*FRUIT_KEYS.length)];return{kind:'combo',chestnut:cOrder,flavor,text:`${cOrder.text} + ${FRUITS[flavor].kr} 슬러시`,payout:cOrder.payout+SLUSH_PRICE,chestnutDone:false,slushDone:false};}
  const special=Math.random()<0.08;special?stats.specialOrders++:stats.normalOrders++;return createChestnutOrder(special);
}
function matchChestnutOrder(bag,order){if(!bag||!order)return false;const c=countMap(bag.items);return bag.items.length===15&&bag.items.every(v=>['perfect','under','burnt'].includes(v))&&(c.perfect||0)===order.counts.perfect&&(c.under||0)===order.counts.under&&(c.burnt||0)===order.counts.burnt;}

/* ─── 3단계 제스처 바인딩 ─── */
function bindGesture3(node,{tap=null,hold1=null,hold2=null,tapMax=220,holdDelay=500,hold2Delay=900,repeatDelay=180,moveThreshold=12,preventDefault=false}={}){
  let ptId=null,sX=0,sY=0,sT=0,moved=false,h1T=null,h2T=null,repT=null,h1F=false;
  const clrAll=()=>{clearTimeout(h1T);clearTimeout(h2T);clearInterval(repT);h1T=h2T=repT=null;};
  const cleanup=()=>{clrAll();window.removeEventListener('pointerup',onUp,{capture:true});window.removeEventListener('pointercancel',onUp,{capture:true});window.removeEventListener('pointermove',onMv,{capture:true});if(ptId!==null){try{node.releasePointerCapture(ptId);}catch(e){}}ptId=null;};
  const onMv=e=>{if(e.pointerId!==ptId)return;if(Math.hypot(e.clientX-sX,e.clientY-sY)>moveThreshold)moved=true;};
  const onUp=e=>{if(e.pointerId!==ptId)return;const dur=Date.now()-sT;const wasTap=!h1F&&!moved&&dur<=tapMax;cleanup();if(wasTap&&tap)tap();};
  node.addEventListener('pointerdown',e=>{
    if(ptId!==null)return;if(preventDefault)e.preventDefault();
    ptId=e.pointerId;sX=e.clientX;sY=e.clientY;sT=Date.now();moved=false;h1F=false;
    try{node.setPointerCapture(e.pointerId);}catch(err){}
    window.addEventListener('pointerup',onUp,{capture:true});window.addEventListener('pointercancel',onUp,{capture:true});window.addEventListener('pointermove',onMv,{capture:true});
    const tutSpeed=(typeof tut!=='undefined'&&tut.active&&tut.stepIndex>=15)?5:1;const hd=holdDelay/tutSpeed, h2d=hold2Delay/tutSpeed, rd=repeatDelay/tutSpeed;h1T=setTimeout(()=>{if(ptId===null||moved)return;h1F=true;if(hold1)hold1();h2T=setTimeout(()=>{if(ptId===null||moved)return;if(hold2){hold2();repT=setInterval(()=>{if(ptId===null){cleanup();return;}if(hold2&&hold2()===false){clearInterval(repT);repT=null;}},rd);}},h2d-hd);},hd);
  });
}

/* ─── 손님 쫓아내기 ─── */
function bindGuestDismiss(guestEl,guestObj){
  let ptId=null,hT=null,holding=false,moved=false,sX=0,sY=0;
  const limit=12;
  const cancel=()=>{clearTimeout(hT);hT=null;};
  const cleanup=()=>{cancel();holding=false;moved=false;guestEl.classList.remove('holding');window.removeEventListener('pointerup',onUp,{capture:true});window.removeEventListener('pointercancel',onUp,{capture:true});window.removeEventListener('pointermove',onMove,{capture:true});ptId=null;};
  const onMove=e=>{if(e.pointerId!==ptId)return;if(Math.hypot(e.clientX-sX,e.clientY-sY)>limit){moved=true;cancel();guestEl.classList.remove('holding');}};
  const onUp=e=>{if(e.pointerId!==ptId)return;if(!holding&&!moved){cleanup();deliverOrder(guestObj);tut.onAction('guestDeliver');}else cleanup();};
  guestEl.addEventListener('pointerdown',e=>{
    if(!guestObj.active||ptId!==null)return;ptId=e.pointerId;sX=e.clientX;sY=e.clientY;holding=false;moved=false;
    try{guestEl.setPointerCapture(e.pointerId);}catch(err){} guestEl.classList.remove('holding');
    window.addEventListener('pointerup',onUp,{capture:true});window.addEventListener('pointercancel',onUp,{capture:true});window.addEventListener('pointermove',onMove,{capture:true});
    hT=setTimeout(()=>{if(ptId===null||moved)return;holding=true;guestEl.classList.add('holding');hT=setTimeout(()=>{if(ptId===null||moved)return;cleanup();dismissGuest(guestObj);tut.onAction('guestDismiss');},500);},500);
  });
}
function dismissGuest(guest){
  if(!guest.active)return;
  guest.active=false;guest.order=null;chestnutServeStage=0;adjustSatisfaction(-0.5);
  $(`guest${guest.slot}`).classList.remove('show','holding');
  $(`order${guest.slot}`).classList.remove('show');
  const toast=document.createElement('div');toast.className='dismiss-toast';toast.textContent='손님을 쫓아냈습니다!';$('appRoot').appendChild(toast);
  setTimeout(()=>{toast.style.opacity='0';toast.style.transition='opacity .3s';setTimeout(()=>toast.remove(),300);},1200);
  syncTop();
}

/* ─── 칼질 캔버스 ─── */
let peelCtx=null;
const peelSegments=[];
const SEGMENT_LIFE=600;

function initPeelCanvas(){
  const canvas=el.peelCanvas,card=el.peelCard;
  canvas.width=card.offsetWidth;canvas.height=card.offsetHeight;
  peelCtx=canvas.getContext('2d');
  peelCtx.lineCap='round';peelCtx.lineJoin='round';
  peelSegments.length=0;
}
function clearPeelCanvas(){if(!peelCtx)return;peelCtx.clearRect(0,0,el.peelCanvas.width,el.peelCanvas.height);}

let _peelRafId=null;
function schedulePeelRedraw(){
  if(_peelRafId)return;
  _peelRafId=requestAnimationFrame(()=>{_peelRafId=null;redrawPeelCanvas();});
}
function redrawPeelCanvas(){
  if(!peelCtx)return;
  const now=Date.now();
  while(peelSegments.length>0&&now-peelSegments[0].t>SEGMENT_LIFE)peelSegments.shift();
  clearPeelCanvas();
  peelSegments.forEach(seg=>{
    const age=now-seg.t;
    const alpha=Math.max(0,1-age/SEGMENT_LIFE);
    peelCtx.beginPath();
    peelCtx.moveTo(seg.x1,seg.y1);peelCtx.lineTo(seg.x2,seg.y2);
    peelCtx.strokeStyle=`rgba(255,255,255,${alpha*0.92})`;
    peelCtx.lineWidth=5;peelCtx.shadowColor=`rgba(255,255,255,${alpha*0.6})`;peelCtx.shadowBlur=10;
    peelCtx.stroke();peelCtx.shadowBlur=0;
  });
  if(peelSegments.length>0)schedulePeelRedraw();
}
function addPeelSegment(x1,y1,x2,y2){
  peelSegments.push({x1,y1,x2,y2,t:Date.now()});
  schedulePeelRedraw();
}

let peelRevealPct=0;
function updateRevealClip(){

}
function animateReveal(targetPct){
  const start=peelRevealPct;const diff=targetPct-start;let elapsed=0;const dur=150;
  const step=()=>{elapsed+=16;const t=Math.min(1,elapsed/dur);peelRevealPct=start+diff*t;updateRevealClip();if(t<1)requestAnimationFrame(step);};
  requestAnimationFrame(step);
}

/* ─── 봉지 관리 ─── */
function addItemToSelectedBag(itemType){
  if(!selectedType||selectedType!=='bag')return false;
  if(String(itemType).startsWith('slush_'))return false;
  if((inventory[itemType]||0)<=0)return false;
  let bagIndex=selectedBagIndex;
  if(bagIndex<0){if(inventory.bag<=0)return false;bagStacks.push({items:[]});bagIndex=bagStacks.length-1;selectedBagIndex=bagIndex;inventory.bag--;}
  const bag=bagStacks[bagIndex];if(!bag||bag.items.length>=15)return false;
  inventory[itemType]--;bag.items.push(itemType);renderInventory();
  if(el.bagOverlay.classList.contains('show')&&bagStacks[bagIndex])renderBagView(bagIndex);
  if(tut.active&&tut.stepIndex===16){const b=bagStacks[selectedBagIndex];if(b&&b.items.length>=15)tut.onAction('bagFull');}
  return true;
}
function openBagView(index){const bag=bagStacks[index];if(!bag)return;chestnutServeStage=2;selectedType='bag';selectedBagIndex=index;renderInventory();renderBagView(index);openOverlay(el.bagOverlay);}
function handleBagRemoval(removedIndex){if(selectedType!=='bag')return;if(selectedBagIndex===removedIndex){if(bagStacks.length===0)selectedBagIndex=-1;else if(removedIndex>=bagStacks.length)selectedBagIndex=bagStacks.length-1;}else if(selectedBagIndex>removedIndex)selectedBagIndex--;if(bagStacks.length===0)chestnutServeStage=0;}
function removeItemFromBag(bagIndex,itemIndex){const bag=bagStacks[bagIndex];if(!bag)return;const removed=bag.items.splice(itemIndex,1)[0];if(removed)inventory[removed]=(inventory[removed]||0)+1;if(bag.items.length===0){bagStacks.splice(bagIndex,1);inventory.bag++;handleBagRemoval(bagIndex);}renderInventory();if(bagStacks.length===0){selectedBagIndex=-1;chestnutServeStage=0;closeOverlay(el.bagOverlay);return;}const ni=Math.max(0,Math.min(bagIndex,bagStacks.length-1));if(el.bagOverlay.classList.contains('show'))renderBagView(ni);}

function spawnGuestBatchActive(){
  const free=guests.filter(v=>!v.active);if(free.length===0)return;
  if(!(tut.active&&tut.stepIndex>=15)){if(Math.random()>getGuestSpawnChance())return;}
  const phase=getTimePhase(gameMinutes);
  const baseCount=(phase==='저녁'||phase==='밤')?2:1;
  const extraChance=(phase==='저녁'||phase==='밤')?0.55:(phase==='오후'?0.3:0.12);
  const count=Math.min(free.length,baseCount+(Math.random()<extraChance?1:0));
  free.slice(0,count).forEach(g=>{
    if(tut.active&&tut.stepIndex>=15){
      g.active=true;g.order={kind:'chestnut',mode:'normal',counts:{perfect:15,under:0,burnt:0},total:15,text:'잘 익은 군밤 15개 주세요',payout:BAG_PRICE};

/* ═══════════════════════════════════════════════════
   칼질 스와이프 — 핵심 수정:
   1) 전체 항목 소진 시에만 다음 단계 진행
   2) 스와이프 연속 허용 (traveled 리셋 + fired 없음)
   ═══════════════════════════════════════════════════ */
(()=>{
  let ptId=null,drawing=false,lastX=0,lastY=0,traveled=0;
  // fired 제거 → 연속 스와이프 허용
  const SWIPE_DIST=14; // 최소 스와이프 거리(px)
  const SWIPE_COOLDOWN=24; // ms: 튜토리얼 칼질은 5배 빠르게
  let lastSliceAt=0;

  function doSlice(){
    const now=Date.now();
    if(now-lastSliceAt<SWIPE_COOLDOWN)return false;
    const type=el.peelOverlay.dataset.peelType;
    if(!type||(inventory[type]||0)<=0)return false;
    const next=STAGES[type].next;
    if(!next)return false;

    lastSliceAt=now;
    el.peelCard.classList.remove('knife-slice-flash');
    void el.peelCard.offsetWidth;
    el.peelCard.classList.add('knife-slice-flash');
    if(tut.active&&!el.peelCard.querySelector('.tut-speed-note')){const n=document.createElement('div');n.className='tut-speed-note';n.textContent='튜토리얼 속도 5배 적용됨';n.style.cssText='position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:30;background:#ffd768;color:#1a1200;border-radius:999px;padding:4px 9px;font-size:10px;font-weight:900;white-space:nowrap;pointer-events:none';el.peelCard.appendChild(n);} 
    const amount=Math.min(slicePerSwipe,inventory[type]);
    inventory[type]-=amount;
    inventory[next]+=amount;
    const done=Number(el.peelOverlay.dataset.peelDone||0)+amount;
    const total=Number(el.peelOverlay.dataset.peelTotal||0);
    el.peelOverlay.dataset.peelDone=String(done);
    el.peelCount.textContent=`${done} / ${total}`;

    const pct=total>0?(done/total)*100:0;
    animateReveal(Math.min(100,pct));
    renderInventory();

    // 튜토리얼 알림 (매 스와이프마다)
    tut.onAction('peelSwipe');

    // ★ 전량 소진 시에만 닫기 + 단계 진행
    if(inventory[type]<=0){
      setTimeout(()=>{
        closeOverlay(el.peelOverlay);
        peelSegments.length=0;
        clearPeelCanvas();
        el.peelOverlay.dataset.peelType='';
      },150);
    }
    return true;
  }

  el.peelCard.addEventListener('pointerdown',e=>{
    if(!el.peelOverlay.classList.contains('show'))return;
    if(ptId!==null)return;
    ptId=e.pointerId;
    drawing=true;
    traveled=0;
    const box=el.peelCard.getBoundingClientRect();
    lastX=e.clientX-box.left;
    lastY=e.clientY-box.top;
    if(!peelCtx)initPeelCanvas();
    try{el.peelCard.setPointerCapture(e.pointerId);}catch(err){}
    e.preventDefault();
    e.stopPropagation();
  },{capture:true});

  el.peelCard.addEventListener('pointermove',e=>{
    if(!drawing||e.pointerId!==ptId)return;
    const box=el.peelCard.getBoundingClientRect();
    const cx=e.clientX-box.left,cy=e.clientY-box.top;
    addPeelSegment(lastX,lastY,cx,cy);
    const dx=cx-lastX,dy=cy-lastY;
    traveled+=Math.hypot(dx,dy);
    // SWIPE_DIST 초과 시마다 썰기 실행 후 traveled 리셋 → 연속 썰기
    if(traveled>=SWIPE_DIST){
      doSlice();
      traveled=0; // ★ 리셋으로 연속 스와이프 허용
    }
    lastX=cx;lastY=cy;
    e.preventDefault();
    e.stopPropagation();
  },{capture:true});

  const endSlice=e=>{
    if(e.pointerId!==ptId)return;
    drawing=false;
    ptId=null;
    traveled=0;
  };
  el.peelCard.addEventListener('pointerup',endSlice,{capture:true});
  el.peelCard.addEventListener('pointercancel',endSlice,{capture:true});
})();

/* ══════════════════════════════════════════
   튜토리얼 시스템 (18단계)
══════════════════════════════════════════ */
function beginSlushTutorial(){
  inventory.syrup_papaya=(inventory.syrup_papaya||0)+1;inventory.cup=(inventory.cup||0)+1;renderInventory();
}
function spawnSlushTutorialGuest(){
  const g=guests[0];g.active=true;g.order={kind:'slush',flavor:'papaya',total:1,text:'파파야 슬러시 1개 주세요',payout:SLUSH_PRICE};
  $('bubble0').innerHTML=g.order.text;$('badge0').textContent='슬러시';$('badge0').className='badge wait slush';$('guest0').classList.add('show');$('order0').classList.add('show');syncTop();tut.onAction('slushGuestSpawned');
}
const tut={
  active:false,stepIndex:0,waitingFor:null,
  tutEl:{spotlight:$('tutSpotlight'),highlight:$('tutHighlight'),bubble:$('tutBubble'),skip:$('tutSkipBtn'),start:$('tutStartBtn')},

  _updateSpotlight(rect){
    const aR=$('appRoot').getBoundingClientRect();
    if(!rect){this.tutEl.spotlight.style.clipPath='none';return;}
    const pad=8,x1=rect.left-aR.left-pad,y1=rect.top-aR.top-pad,x2=x1+(rect.width+pad*2),y2=y1+(rect.height+pad*2),W=aR.width,H=aR.height;
    this.tutEl.spotlight.style.clipPath=`polygon(0 0,${W}px 0,${W}px ${H}px,0 ${H}px,0 0,${x1}px ${y1}px,${x1}px ${y2}px,${x2}px ${y2}px,${x2}px ${y1}px,${x1}px ${y1}px)`;
  },

  highlight(selector,bubbleHtml,arrowDir='top'){
    const el2=typeof selector==='string'?document.querySelector(selector):selector;
    const aR=$('appRoot').getBoundingClientRect();
    this.tutEl.spotlight.classList.add('active');
    // 건너뛰기는 항상 표시
    this.tutEl.skip.style.display='block';
    this._clearTarget();

    if(!el2){
      this._updateSpotlight(null);
      this.tutEl.highlight.style.display='none';
      const b=this.tutEl.bubble;
      b.style.display='block';b.style.left='50%';b.style.transform='translateX(-50%)';b.style.top='40%';b.className='tut-bubble';b.innerHTML=bubbleHtml;
      return;
    }

    const scope=el2.closest?.('.modal,.stock-scroll,.shop-cart,.bag-list')||null;
    if(scope&&typeof el2.scrollIntoView==='function'){try{el2.scrollIntoView({block:'center',inline:'nearest'});}catch(err){}}
    this._activeTarget=el2;

    const paint=()=>{
      const aR2=$('appRoot').getBoundingClientRect();
      const rect=el2.getBoundingClientRect(),pad=8;
      const hl=this.tutEl.highlight;
      hl.style.display='block';
      hl.style.left=(rect.left-aR2.left-pad)+'px';
      hl.style.top=(rect.top-aR2.top-pad)+'px';
      hl.style.width=(rect.width+pad*2)+'px';
      hl.style.height=(rect.height+pad*2)+'px';
      this._updateSpotlight(rect);
      const b=this.tutEl.bubble;
      b.style.display='none';void b.offsetWidth;b.style.display='block';
      b.className='tut-bubble'+(arrowDir?' arrow-'+arrowDir:'');
      b.style.transform='';b.style.left='';b.style.top='';b.style.bottom='';b.style.right='';
      const bw=200,bh=90;
      if(arrowDir==='top'){let bl=rect.left-aR2.left;let bt=rect.bottom-aR2.top+18;if(bl+bw>aR2.width-8)bl=aR2.width-8-bw;if(bl<8)bl=8;b.style.left=bl+'px';b.style.top=bt+'px';}
      else if(arrowDir==='bottom'){let bl=rect.left-aR2.left;let bt=rect.top-aR2.top-bh-18;if(bl+bw>aR2.width-8)bl=aR2.width-8-bw;if(bl<8)bl=8;if(bt<8)bt=8;b.style.left=bl+'px';b.style.top=bt+'px';}
      else if(arrowDir==='left'){b.style.left=(rect.right-aR2.left+18)+'px';b.style.top=(rect.top-aR2.top)+'px';}
      else{b.style.left='50%';b.style.transform='translateX(-50%)';b.style.top='45%';}
      b.innerHTML=bubbleHtml;
    };
    requestAnimationFrame(()=>requestAnimationFrame(paint));
  },

  _activeTarget:null,
  _clearTarget(){if(this._activeTarget){this._activeTarget.style.pointerEvents='';this._activeTarget.style.touchAction='';this._activeTarget.style.position='';this._activeTarget.style.zIndex='';this._activeTarget=null;}},
  hide(){this._clearTarget();this.tutEl.spotlight.classList.remove('active');this.tutEl.spotlight.style.clipPath='none';this.tutEl.highlight.style.display='none';this.tutEl.bubble.style.display='none';
    // 건너뛰기 버튼은 active 중에만 숨김 처리 → end()에서 숨김
  },
  end(){this.active=false;this.waitingFor=null;this.hide();this.tutEl.skip.style.display='none';this.tutEl.start.style.display='none';},

  showNotice(html,goStep=null,delay=1400){
    this.hide();this.tutEl.spotlight.classList.add('active');this.tutEl.spotlight.style.clipPath='none';this.tutEl.skip.style.display='block';
    const b=this.tutEl.bubble;b.className='tut-bubble';b.style.display='block';b.style.left='50%';b.style.transform='translateX(-50%)';b.style.top='38%';b.innerHTML=html;
    if(goStep!==null)setTimeout(()=>{if(this.active)this.goStep(goStep);},delay);
  },

  showCompletion(){
    this.hide();this.tutEl.spotlight.classList.add('active');this.tutEl.spotlight.style.clipPath='none';
    const b=this.tutEl.bubble;b.className='tut-bubble';b.style.display='block';b.style.left='50%';b.style.transform='translateX(-50%)';b.style.top='32%';
    b.innerHTML='<b>튜토리얼 완료! 🎉</b><br>이제 직접 군밤 푸드트럭<br>장사를 해보자.<br>즐기세요!';
    this.tutEl.start.style.display='block';this.tutEl.start.textContent='게임 시작! 🎉';
    this.tutEl.skip.style.display='none';
  },

  badge(n){return `<div class="tut-step-badge">${n} / 25</div>`;},

  goStep(index){
    this.stepIndex=index;
    const B=this.badge.bind(this);
    switch(index){
      case 0: // 환영
        this.hide();
        this.tutEl.spotlight.classList.add('active');this.tutEl.spotlight.style.clipPath='none';
        // ★ 처음에도 건너뛰기 표시
        this.tutEl.skip.style.display='block';
        const bw=this.tutEl.bubble;bw.className='tut-bubble';bw.style.display='block';bw.style.left='50%';bw.style.transform='translateX(-50%)';bw.style.top='30%';
        bw.innerHTML=`${B(1)}군밤 타이쿤에 오신걸<br>환영합니다!<br>일반주문 튜토리얼을<br>시작해볼까요?`;
        this.tutEl.start.style.display='block';this.tutEl.start.textContent='튜토리얼 시작!';this.waitingFor='welcomeStart';break;
      case 1:
        this.highlight('#storeBtn',`${B(2)}밤과 종이봉지를<br>구매해보자.`,'bottom');this.waitingFor='storeBtn';break;
      case 2:
        setTimeout(()=>{this.highlight('#shopMaterials',`${B(3)}생밤을 장바구니에<br>담자.`,'top');},400);this.waitingFor='chestnutAdded';break;
      case 3:
        setTimeout(()=>{
          // ★ 봉지 아이템만 하이라이트 (shopSupplies 전체 X)
          const bagItem=document.querySelector('#shopSupplies .shop-item');
          if(bagItem){
            this.highlight(bagItem,`${B(4)}종이봉지를 장바구니에<br>담자.`,'top');
            bagItem.scrollIntoView({behavior:'smooth',block:'nearest'});
          }else{
            this.highlight('#shopSupplies',`${B(4)}종이봉지를 장바구니에<br>담자.`,'top');
          }
        },300);this.waitingFor='bagAdded';break;
      case 4:
        this.highlight('#checkoutBtn',`${B(5)}장바구니에 담긴 물건을<br>주문해보자!`,'top');this.waitingFor='checkoutBtn';break;
      case 5:
        setTimeout(()=>{closeOverlay(el.shopOverlay);setTimeout(()=>{this.highlight('#stockGrid [data-type="raw_inner"]',`${B(6)}재고에서<br><b>생밤(속껍질)</b>을<br>선택하자.`,'bottom');},400);},100);this.waitingFor='selectRawInner';break;
      case 6:
        this.highlight('#knifeBtn',`${B(7)}칼 사용하기를 눌러서<br>칼집을 내보자.`,'bottom');this.waitingFor='knifeBtn';break;
      case 7:
        setTimeout(()=>{this.highlight('#peelCard',`${B(8)}생밤(속껍질) 위를<br>스와이프해서<br>전부 칼집을 내자.`,'bottom');},300);this.waitingFor='peelSwipe';break;
      case 8:
        setTimeout(()=>{this.highlight('#stockGrid [data-type="cut_raw"]',`${B(9)}재고에서<br><b>칼집을 낸 생 밤(속껍질)</b>을<br>선택하자.`,'bottom');},400);this.waitingFor='selectCutRaw';break;
      case 9:
        this.highlight('.grill-zone',`${B(10)}그릴트레이를 눌러<br>생밤 30개를<br>구이통에 넣어보세요.<br>남은밤 ${30-grill.length}/30`,'bottom');this.waitingFor='grillInsert';break;
      case 10:
        this.highlight('#heatControl',`${B(11)}게이지를 클릭해<br>초록구간까지 구우세요.`,'top');this.waitingFor='heatTouchStart';break;
      case 11:
        this.highlight('#heatControl',`${B(12)}바늘이 초록구간에<br>오면 다시 클릭해<br>굽기를 멈추세요!`,'top');this.waitingFor='heatTouchOut';break;
      case 12:
        setTimeout(()=>{this.highlight('#stockGrid [data-type="perfect_inner"]',`${B(13)}재고에서<br><b>잘 익은 군밤(속껍질)</b>을<br>선택하세요.`,'bottom');},300);this.waitingFor='selectPerfectInner';break;
      case 13:
        this.highlight('#knifeBtn',`${B(14)}칼 사용하기를 눌러<br>껍질을 벗기세요.`,'bottom');this.waitingFor='knifeBtn2';break;
      case 14:
        setTimeout(()=>{this.highlight('#peelCard',`${B(15)}잘 익은 군밤(속껍질)<br>위를 스와이프해서<br>전부 껍질을 벗기자.`,'bottom');},300);this.waitingFor='peelSwipe2';break;
      case 15:
        setTimeout(()=>{this.highlight('#stockGrid [data-type="bag"]',`${B(16)}재고에서<br><b>종이봉지</b>를 선택하세요.`,'bottom');},400);this.waitingFor='selectBag';break;
      case 16:
        this.highlight('#stockGrid [data-type=\"perfect\"]',`${B(17)}종이봉지를 선택한 후<br><b>군밤을 길게 눌러<br>봉지에 15개 담으세요!</b>`,'bottom');this.waitingFor='bagFill';break;
      case 17:
        this.highlight('#shopBtn',`${B(18)}장사 시작을 눌러<br>손님을 받으세요.`,'bottom');this.waitingFor='shopBtn';break;
      case 18:
        this.highlight('.window',`${B(19)}봉지를 선택한 뒤<br>손님을 탭해서<br>팔아보자!`,'top');this.waitingFor='guestDeliver';break;
      case 19:
        this.highlight('#stockGrid [data-type=\"syrup_papaya\"]',`${B(20)}파파야 시럽을 선택하고<br>슬러시 기계를 채워보세요.`,'bottom');this.waitingFor='selectSlushSyrup';break;
      case 20:
        this.highlight('#slushPanel',`${B(21)}슬러시 기계를 눌러<br>원액을 넣으세요.`,'top');this.waitingFor='fillSlush';break;
      case 21:
        this.highlight('#stockGrid [data-type=\"cup\"]',`${B(22)}컵을 선택하세요.`,'bottom');this.waitingFor='selectCup';break;
      case 22:
        this.highlight('#slushPanel',`${B(23)}슬러시 기계를 다시 눌러<br>컵에 담으세요.`,'top');this.waitingFor='pourSlush';break;
      case 23:
        this.highlight('.window',`${B(24)}슬러시 손님이 왔어요.<br>파파야 슬러시를 선택하고<br>손님을 탭하세요.`,'top');this.waitingFor='slushGuestSpawned';break;
      case 24:
        this.highlight('.window',`${B(25)}파파야 슬러시를 선택한 뒤<br>손님을 탭해서<br>팔아보세요!`,'top');this.waitingFor='slushDeliver';break;
    }
  },

  _knifeForPerfect:false,

  onAction(action){
    if(!this.active)return;
    if(this.stepIndex===0&&this.waitingFor==='welcomeStart'&&action==='tutStart'){this.goStep(1);return;}
    if(this.stepIndex===1&&action==='storeBtn'){this.goStep(2);return;}
    if(this.stepIndex===2&&action==='chestnutAdded'){this.goStep(3);return;}
    if(this.stepIndex===3&&action==='bagAdded'){this.goStep(4);return;}
    if(this.stepIndex===4&&action==='checkoutBtn'){this.goStep(5);return;}
    if(this.stepIndex===5&&action==='selectRawInner'){this.goStep(6);return;}
    if(this.stepIndex===6&&action==='knifeBtn'){this._knifeForPerfect=false;this.goStep(7);return;}
    // ★ 7단계: peelSwipe → 전량 소진 시에만 다음 단계
    if(this.stepIndex===7&&action==='peelSwipe'){
      // 전량 소진(=오버레이가 닫혀있거나 재고 없음) 체크
      const type=el.peelOverlay.dataset.peelType;
      if(!type||(inventory[type]||0)<=0){this.goStep(8);}
      return;
    }
    if(this.stepIndex===8&&action==='selectCutRaw'){this.goStep(9);return;}
    if(this.stepIndex===9&&action==='grillInsert'){
      if(grill.length<30){
        const b=this.tutEl.bubble;
        if(b.style.display!=='none')b.innerHTML=`${this.badge(10)}그릴트레이를 눌러<br>생밤 30개를<br>구이통에 넣어보세요.<br>남은밤 ${30-grill.length}/30`;
        return;
      }
      this.goStep(10);return;
    }
    if(this.stepIndex===10&&action==='heatTouchStart'){cooking=true;this.goStep(11);return;}
    if(this.stepIndex===11&&action==='heatTouchOut'){this.goStep(12);return;}
    if(this.stepIndex===12&&action==='selectPerfectInner'){this._knifeForPerfect=true;this.goStep(13);return;}
    if(this.stepIndex===13&&action==='knifeBtn'){if(this._knifeForPerfect)this.goStep(14);return;}
    // ★ 14단계: peelSwipe → 전량 소진 시에만 다음 단계
    if(this.stepIndex===14&&action==='peelSwipe'){
      const type=el.peelOverlay.dataset.peelType;
      if(!type||(inventory[type]||0)<=0){this.goStep(15);}
      return;
    }
    if(this.stepIndex===15&&action==='selectBag'){this.goStep(16);return;}
    if(this.stepIndex===16&&action==='selectBag'){this.highlight('#stockGrid [data-type=\"perfect\"]',`${this.badge(17)}종이봉지를 선택했어요.<br><b>잘 익은 군밤</b>을 길게 눌러 담으세요.`,'bottom');return;}
    if(this.stepIndex===16&&action==='bagFull'){this.goStep(17);return;}
    if(this.stepIndex===17&&action==='shopBtn'){this.goStep(18);return;}
    if(this.stepIndex===18&&action==='guestSpawned'){return;}
    if(this.stepIndex===18&&action==='guestDeliver'){this.waitingFor=null;setTimeout(()=>{beginSlushTutorial();this.active=true;this.goStep(19);},800);return;}
    if(this.stepIndex===19&&action==='selectSlushSyrup'){this.goStep(20);return;}
    if(this.stepIndex===20&&action==='fillSlush'){this.goStep(21);return;}
    if(this.stepIndex===21&&action==='selectCup'){this.goStep(22);return;}
    if(this.stepIndex===22&&action==='pourSlush'){this.goStep(23);setTimeout(spawnSlushTutorialGuest,350);return;}
    if(this.stepIndex===23&&action==='slushGuestSpawned'){this.goStep(24);return;}
    if(this.stepIndex===24&&action==='slushDeliver'){this.active=false;this.waitingFor=null;setTimeout(()=>this.showCompletion(),800);return;}
  },

  onTapItem(key){
    if(!this.active)return;
    if(this.stepIndex===5&&key==='raw_inner')this.onAction('selectRawInner');
    else if(this.stepIndex===8&&key==='cut_raw')this.onAction('selectCutRaw');
    else if(this.stepIndex===12&&key==='perfect_inner')this.onAction('selectPerfectInner');
  },

  start(){
    this.active=true;this.stepIndex=0;this.waitingFor=null;this._knifeForPerfect=false;
    this.goStep(0);
  }
};

/* 건너뛰기 버튼 — 항상 즉시 종료 */
$('tutSkipBtn').addEventListener('click',()=>tut.end());

/* 시작/완료 버튼 */
$('tutStartBtn').addEventListener('click',()=>{
  $('tutStartBtn').style.display='none';
  if(tut.active&&tut.stepIndex===0){
    tut.onAction('tutStart');
  }else{
    // 완료 화면에서 게임 시작
    satisfaction=4.5;money+=tutorialPurchased.bagPack*2000+tutorialPurchased.chestnutPack*14000;tutorialPurchased={bagPack:0,chestnutPack:0};syncTop();tut.end();
  }
});

function initialRender(){renderInventory();renderShop();updateSliceUpgradeUI();syncTop();startClockReal();}
initialRender();
setTimeout(()=>tut.start(),600);
